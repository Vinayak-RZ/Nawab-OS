# Production nginx for nawab-os.stamped.work (certbot SSL paths)

upstream founder_os {
    server 127.0.0.1:8787;
    keepalive 8;
}

server {
    server_name nawab-os.stamped.work;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /opt/founder-os/dashboard/static/;
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    location / {
        proxy_pass http://founder_os;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        client_max_body_size 32m;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/nawab-os.stamped.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nawab-os.stamped.work/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = nawab-os.stamped.work) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name nawab-os.stamped.work;
    return 404;
}
