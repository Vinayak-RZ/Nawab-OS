# /etc/nginx/sites-available/founder-os
# Replace YOUR_DOMAIN, then: sudo nginx -t && sudo systemctl reload nginx

upstream founder_os {
    server 127.0.0.1:8787;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Static assets — served by nginx (not Gunicorn)
    location /static/ {
        alias /opt/founder-os/dashboard/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://founder_os;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        client_max_body_size 32m;
    }
}

# After certbot --nginx, HTTPS block is added automatically.
